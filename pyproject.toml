[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["redenv", ".venv", "__pycache__", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in argument defaults (common in discord.py)
    "B904",   # raise from inside except — sometimes intentional
    "SIM108", # ternary operator — often less readable
    "SIM117", # nested with — sometimes intentional
    "RUF012", # mutable class attributes — common Redbot/discord.py pattern
]

[tool.ruff.lint.isort]
known-third-party = ["discord", "redbot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

# Basedpyright settings for Redbot cog development
[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
baselineFile = ".basedpyright/baseline.json"
venvPath = "."
venv = "redenv"

# Redbot is not fully typed, and its dependencies can cause missing import errors.
# Only report missing imports if they are truly missing from the environment.
reportMissingImports = true

# Ignore test files or specific temporary directories if any
exclude = [
    ".git",
    ".vscode",
    ".github",
    "redenv",
    "__pycache__"
]
