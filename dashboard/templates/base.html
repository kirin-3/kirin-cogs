<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ title }}{% endblock %} · Unicornia staff</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/site.js" defer></script>
</head>
<body>
<div class="rainbow-bar" aria-hidden="true"></div>
<header class="top">
  <a class="brand" href="/"><img src="/static/logo.png" alt="" width="36" height="36"><span>Unicornia <small>staff</small></span></a>
  {% if session %}
  <nav class="nav">
    <a href="/"{% if path == "/" or path.startswith("/bans/") %} class="on"{% endif %}>Bans</a>
    <a href="/automod"{% if path.startswith("/automod") %} class="on"{% endif %}>Automod</a>
  </nav>
  <form class="logout" method="post" action="/logout">
    <span>{{ user_name(session.user_id) }}</span>
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <button type="submit">Log out</button>
  </form>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
