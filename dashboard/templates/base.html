<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ title }}{% endblock %} · Unicornia staff</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Unicornia staff</a>
  {% if session %}
  <nav class="nav"><a href="/">Bans</a><a href="/automod">Automod</a></nav>
  <form class="logout" method="post" action="/logout">
    <span>{{ user_name(session.user_id) }}</span>
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <button type="submit">Log out</button>
  </form>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
