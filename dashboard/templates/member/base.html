<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ title }}{% endblock %} · Unicornia</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/site.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Unicornia</a>
  {% if session %}
  <nav class="nav">
    <a href="/roleplay"{% if path == "/roleplay" %} class="on"{% endif %}>Roleplay</a>
    {% if nav and nav.supporter %}
    <a href="/commands"{% if path.startswith("/commands") %} class="on"{% endif %}>Commands</a>
    <a href="/emojis"{% if path.startswith("/emojis") %} class="on"{% endif %}>Emojis</a>
    {% endif %}
    {% if nav and nav.role %}
    <a href="/role"{% if path.startswith("/role/") or path == "/role" %} class="on"{% endif %}>Custom role</a>
    {% endif %}
  </nav>
  <form class="logout" method="post" action="/logout">
    <span>{{ user_name(session.user_id) }}</span>
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <button type="submit">Log out</button>
  </form>
  {% endif %}
</header>
<main>
{% if error %}<p class="notice">{{ error }}</p>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
