<section class="panel">
  <h2>Send in a gif</h2>
  <p class="empty">Staff look at every gif before it's added, so it can take a while to show up. It has to be a GIF, and no bigger than Discord lets the bot send.</p>
  <form class="editor" method="post" action="/gifs/upload" enctype="multipart/form-data">
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    {% if action %}
    <input type="hidden" name="from" value="{{ action }}">
    <input type="hidden" name="pool" value="{{ pool }}">
    <input type="hidden" name="page" value="{{ page }}">
    {% endif %}
    <label>Action
      <select name="action" required>
        {% for entry in actions %}<option value="{{ entry.name }}"{% if entry.name == action %} selected{% endif %}>{{ entry.name|capitalize }}</option>{% endfor %}
      </select>
    </label>
    <label>Gif
      <input type="file" name="file" accept="image/gif" required>
    </label>
    <p class="actions"><button class="primary" type="submit">Send</button></p>
  </form>
</section>
