# Unicornia XP Shop Configuration
# To add a hidden background (only available via [p]xpshop give), add "hidden: true" to the item.
# Example:
#   secret_bg:
#     name: Secret Background
#     price: 0
#     url: https://example.com/image.png
#     desc: Secret
#     hidden: true
# For the member site, `preview` (animated WebP) and `still` (first frame) are optional lighter versions of `url`;
# make them with unicornia/tools/bg_webp.py. Rank cards always use `url`.

